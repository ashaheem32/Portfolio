<!doctype html>
<meta charset="utf-8">
<title>Scrub film preview</title>
<style>
  html,body{margin:0;background:#080808;color:#f4f3ef;font:13px/1.4 ui-monospace,Menlo,monospace}
  canvas{display:block;max-width:100vw;max-height:calc(100vh - 48px);margin:0 auto}
  .bar{display:flex;gap:12px;align-items:center;height:48px;padding:0 16px}
  input{flex:1;accent-color:#ff5a36}
</style>
<canvas id="c"></canvas>
<div class="bar"><span id="t">0.00s</span><input id="s" type="range" min="0" max="14" step="0.01" value="0"><span>?w=1920&amp;h=1080</span></div>
<script src="scene.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const scene = ScrubFilm.createScene(W, H);
  const s = document.getElementById('s'), lab = document.getElementById('t');
  const paint = () => { scene.draw(ctx, +s.value); lab.textContent = (+s.value).toFixed(2) + 's'; };
  s.addEventListener('input', paint);
  window.renderAt = (sec) => { scene.draw(ctx, sec); return c.toDataURL('image/png'); };
  document.fonts.load('500 20px "JetBrains Mono"').finally(paint);
</script>
